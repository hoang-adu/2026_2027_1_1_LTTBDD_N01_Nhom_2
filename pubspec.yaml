name: flashcard_app
description: "Ứng dụng học từ vựng Anh–Việt bằng Flashcard (Nhóm 7 – LTTBDD N01)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  fl_chart: ^1.3.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Sinh AppLocalizations từ lib/l10n/*.arb (cấu hình trong l10n.yaml)
  generate: true
  # Font (Be Vietnam Pro, IBM Plex Mono) do Đạt thêm vào assets/fonts và khai báo ở đây.
